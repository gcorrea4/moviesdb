<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieDB - IMDb Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-gray-100 min-h-screen">
<header class="border-b border-zinc-800 bg-black/70 backdrop-blur sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide">
            <span class="bg-[#f5c518] text-black px-2 py-1 rounded">IMDb</span>
            <span class="ml-2">MovieDB</span>
        </h1>
        <p class="text-xs sm:text-sm text-zinc-400">Buscas de filmes com paginacao</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
    <aside class="lg:col-span-1 bg-[#1f1f1f] rounded-xl border border-zinc-800 p-4 h-fit">
        <h2 class="font-semibold text-[#f5c518] mb-3">Menu de endpoints</h2>
        <nav id="menu" class="space-y-2"></nav>
    </aside>

    <section class="lg:col-span-3 space-y-4">
        <div class="bg-[#1f1f1f] rounded-xl border border-zinc-800 p-4 sm:p-5 space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <h2 id="endpointTitle" class="text-lg font-semibold">Todos os filmes</h2>
                <span id="endpointPath" class="text-xs text-zinc-400 font-mono"></span>
            </div>

            <form id="searchForm" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <div class="sm:col-span-2">
                    <label id="queryLabel" for="queryInput" class="block text-sm text-zinc-300 mb-1">Busca</label>
                    <input id="queryInput" name="query" type="text"
                           class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#f5c518] text-sm"
                           placeholder="Digite o valor da busca">
                </div>

                <div id="queryToContainer" class="hidden">
                    <label id="queryLabelTo" for="queryInputTo" class="block text-sm text-zinc-300 mb-1">Ate</label>
                    <input id="queryInputTo" name="queryTo" type="text"
                           class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#f5c518] text-sm"
                           placeholder="Valor final">
                </div>

                <div>
                    <label for="sortField" class="block text-sm text-zinc-300 mb-1">Ordenar por</label>
                    <select id="sortField" name="sortField"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#f5c518] text-sm">
                        <option value="title">Titulo</option>
                        <option value="releaseYear">Ano</option>
                        <option value="rating">Nota</option>
                    </select>
                </div>

                <div>
                    <label for="sortDirection" class="block text-sm text-zinc-300 mb-1">Direcao</label>
                    <select id="sortDirection" name="sortDirection"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#f5c518] text-sm">
                        <option value="asc">Crescente</option>
                        <option value="desc">Decrescente</option>
                    </select>
                </div>

                <div>
                    <label for="size" class="block text-sm text-zinc-300 mb-1">Tamanho da pagina</label>
                    <input id="size" name="size" type="number" min="1" max="50" value="10"
                           class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#f5c518] text-sm">
                </div>

                <div class="sm:col-span-4 flex gap-2">
                    <button type="submit" class="bg-[#f5c518] text-black font-semibold rounded-lg px-4 py-2 hover:brightness-95">Buscar</button>
                    <button type="button" id="clearBtn" class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2 hover:bg-zinc-700">Limpar</button>
                </div>
            </form>
        </div>

        <div class="flex items-center justify-between text-sm text-zinc-300">
            <p id="resultMeta">Nenhuma busca executada.</p>
            <div class="flex items-center gap-2">
                <button id="prevBtn" class="bg-zinc-800 border border-zinc-700 rounded px-3 py-1 disabled:opacity-40" disabled>Anterior</button>
                <button id="nextBtn" class="bg-zinc-800 border border-zinc-700 rounded px-3 py-1 disabled:opacity-40" disabled>Proxima</button>
            </div>
        </div>

        <p id="requestInfo" class="text-xs text-zinc-500 font-mono break-all"></p>
        <div id="status" class="text-sm text-zinc-400"></div>
        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
